<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화면 스케치 스튜디오</title>
<style>
:root{
  --or:#F5821F;--or-d:#DE6E10;--or-l:#FFF3E7;
  --nv:#0F3B7C;--nv-d:#0A2A5C;--nv-l:#EEF3FB;
  --bg:#EDEFF3;--line:#E3E6EC;--line2:#F0F2F6;
  --ink:#141A22;--sub:#6E7787;--mut:#A3ABB8;
  --sh:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.07);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Pretendard","맑은 고딕","Malgun Gothic",system-ui,sans-serif;background:var(--bg);
     color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden;}

.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
     padding:0 16px;gap:12px;position:relative;z-index:30;}
.mark{width:27px;height:27px;border-radius:7px;background:var(--or);position:relative;flex:0 0 auto;}
.mark::before,.mark::after{content:"";position:absolute;background:#fff;width:4px;height:15px;top:6px;border-radius:1px;}
.mark::before{left:6px;}.mark::after{right:6px;}
.mark i{position:absolute;left:6px;right:6px;top:11px;height:4px;background:#fff;border-radius:1px;}
.top b.bn{font-size:14.5px;font-weight:800;letter-spacing:-.3px;}
.sep{width:1px;height:20px;background:var(--line);}
.fname{height:34px;border:1px solid transparent;border-radius:9px;padding:0 11px;font-family:inherit;
       font-size:14px;font-weight:600;outline:none;background:transparent;width:220px;color:var(--ink);}
.fname:hover{background:#F5F6F9;}.fname:focus{border-color:var(--or);background:#fff;}
.top .r{margin-left:auto;display:flex;align-items:center;gap:8px;}
.btn{height:36px;padding:0 15px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;
     cursor:pointer;border:1px solid var(--line);background:#fff;color:#3C4655;
     display:inline-flex;align-items:center;gap:7px;transition:.12s;}
.btn:hover{background:#F7F8FA;border-color:#D2D7E0;}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff;box-shadow:0 3px 12px rgba(245,130,31,.34);font-size:13.5px;}
.btn.pri:hover{background:var(--or-d);}
.btn.nv{background:var(--nv);border-color:var(--nv);color:#fff;}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:8px;}

.stage{position:relative;height:calc(100vh - 56px);overflow:hidden;}
.pane{position:absolute;top:14px;bottom:14px;left:14px;width:276px;background:#fff;border-radius:16px;
      box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;z-index:20;}
.pbd{flex:1;min-height:0;overflow-y:auto;padding:16px;}
.pbd::-webkit-scrollbar{width:9px;}
.pbd::-webkit-scrollbar-thumb{background:#DFE3E9;border-radius:5px;border:3px solid #fff;}
h4{font-size:11.5px;color:var(--sub);font-weight:700;margin:20px 0 9px;}
h4:first-child{margin-top:0;}

.seg{display:flex;background:#F2F4F7;border-radius:10px;padding:3px;gap:2px;}
.seg div{flex:1;height:32px;display:grid;place-items:center;font-size:12.5px;font-weight:600;
         color:var(--sub);border-radius:8px;cursor:pointer;transition:.12s;}
.seg div.on{background:#fff;color:var(--nv);box-shadow:0 1px 3px rgba(16,24,40,.12);}

.tpls{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.tpl{border:2px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;background:#fff;transition:.12s;}
.tpl:hover{border-color:#C6CDD8;}
.tpl.on{border-color:var(--or);background:var(--or-l);}
.wf{height:40px;border-radius:6px;background:#F7F8FA;padding:6px;display:flex;flex-direction:column;gap:3px;}
.wf i{display:block;background:#D8DDE5;border-radius:2px;height:4px;}
.wf .h{height:7px;background:var(--nv);opacity:.3;}
.wf .q{width:38%;}.wf .m{width:64%;}
.wf .g{display:flex;gap:2px;}.wf .g i{flex:1;}
.tpl .nm{font-size:12px;font-weight:600;text-align:center;margin-top:8px;color:#3C4655;}
.tpl.on .nm{color:var(--or-d);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ci{border:2px solid var(--line);border-radius:12px;padding:11px 8px;cursor:pointer;background:#fff;
    display:flex;flex-direction:column;align-items:center;gap:8px;transition:.12s;}
.ci:hover{border-color:var(--or);background:var(--or-l);transform:translateY(-1px);}
.ci .g{width:46px;height:26px;border:2px solid #AEB7C4;border-radius:4px;background:#fff;
       display:flex;align-items:center;justify-content:center;font-size:11px;color:#8E98A6;}
.ci .g.f{background:#E4E9F0;border-color:#8E98A6;}
.ci .g.d{border-style:dashed;}
.ci .g.n{border:none;background:none;font-size:15px;color:var(--nv);font-weight:800;}
.ci .g.l{flex-direction:column;gap:2px;padding:4px;}
.ci .g.l span{display:block;width:100%;height:2.5px;background:#C7CFDA;border-radius:1px;}
.ci .g.u{border:none;border-bottom:3px solid var(--nv);border-radius:0;width:44px;height:20px;background:#FFFCF6;}
.ci .t{font-size:11.5px;font-weight:600;color:#4A5462;}

.note{border-top:1px solid var(--line2);padding:14px 16px;flex:0 0 auto;background:#FCFCFD;}
textarea{width:100%;height:62px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
         font-family:inherit;font-size:12px;line-height:1.6;resize:none;outline:none;}
textarea:focus{border-color:var(--or);}
.drop{margin-top:8px;border:2px dashed #D8DDE5;border-radius:10px;padding:10px;text-align:center;
      font-size:11.5px;color:var(--mut);cursor:pointer;transition:.12s;font-weight:600;}
.drop:hover{border-color:var(--or);color:var(--or-d);background:var(--or-l);}
.files{margin-top:7px;display:flex;flex-direction:column;gap:5px;}
.file{display:flex;align-items:center;gap:7px;font-size:11px;background:#F4F6F9;border-radius:8px;padding:7px 9px;color:#4A5462;}
.file b{margin-left:auto;color:var(--mut);cursor:pointer;font-weight:400;}

.canvas{position:absolute;inset:0 0 0 306px;display:flex;flex-direction:column;align-items:center;
        justify-content:center;overflow:auto;padding:30px 20px 80px;}
.abL{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:10px;}
.abL span{color:var(--mut);font-weight:400;margin-left:8px;}
#board{width:960px;height:600px;background:#fff;position:relative;flex:0 0 auto;border-radius:12px;
       box-shadow:0 1px 3px rgba(16,24,40,.08),0 14px 44px rgba(16,24,40,.12);
       background-image:linear-gradient(#F1F3F7 1px,transparent 1px),linear-gradient(90deg,#F1F3F7 1px,transparent 1px);
       background-size:20px 20px;transform-origin:top center;}

.sh{position:absolute;border:2px solid #A8B1BF;border-radius:6px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#5A6472;
    cursor:move;user-select:none;overflow:hidden;padding:0 8px;white-space:nowrap;}
.sh.sel{border-color:var(--or);z-index:6;}
.sh[data-t=area]{border-style:dashed;border-color:#BFC7D3;background:#FAFBFD;
                 align-items:flex-start;justify-content:flex-start;padding:6px 10px;color:#AEB7C4;font-size:11px;}
.sh[data-t=button]{background:var(--nv);border-color:var(--nv);color:#fff;font-weight:700;}
.sh[data-t=input]{justify-content:flex-start;color:#B4BCC8;}
.sh[data-t=select]{justify-content:space-between;}
.sh[data-t=select]::after{content:"▾";color:#8E98A6;font-size:13px;}
.sh[data-t=list]{background:repeating-linear-gradient(#fff 0 22px,#F4F6FA 22px 44px);
                 align-items:flex-start;padding-top:7px;color:#AEB7C4;}
.sh[data-t=title]{border:none;background:none;justify-content:flex-start;font-weight:800;color:var(--nv);font-size:14px;padding:0;}
.sh[data-t=label]{border:none;background:none;justify-content:flex-start;color:#3C4655;font-weight:600;padding:0 2px;}
.sh[data-t=text]{align-items:flex-start;padding:7px 9px;color:#B4BCC8;}
.sh[data-t=check]{border:none;background:none;justify-content:flex-start;color:#3C4655;padding:0 2px;}
.sh[data-t=check]::before{content:"☐";margin-right:7px;color:#8E98A6;font-size:14px;}
.sh[data-t=date]{justify-content:space-between;color:#B4BCC8;}
.sh[data-t=date]::after{content:"▤";color:#8E98A6;}

.hh{position:absolute;background:#fff;border:2px solid var(--or);border-radius:50%;
    width:11px;height:11px;display:none;z-index:8;}
.sh.sel .hh{display:block;}
.hh[data-d=nw]{left:-6px;top:-6px;cursor:nwse-resize;}
.hh[data-d=ne]{right:-6px;top:-6px;cursor:nesw-resize;}
.hh[data-d=sw]{left:-6px;bottom:-6px;cursor:nesw-resize;}
.hh[data-d=se]{right:-6px;bottom:-6px;cursor:nwse-resize;}
.hh[data-d=n]{left:50%;margin-left:-8px;top:-5px;cursor:ns-resize;border-radius:3px;width:16px;height:9px;}
.hh[data-d=s]{left:50%;margin-left:-8px;bottom:-5px;cursor:ns-resize;border-radius:3px;width:16px;height:9px;}
.hh[data-d=w]{top:50%;margin-top:-8px;left:-5px;cursor:ew-resize;border-radius:3px;width:9px;height:16px;}
.hh[data-d=e]{top:50%;margin-top:-8px;right:-5px;cursor:ew-resize;border-radius:3px;width:9px;height:16px;}

.gd{position:absolute;background:#FF3D7F;pointer-events:none;z-index:9;}
.gd.v{width:1.5px;top:0;bottom:0;}.gd.h{height:1.5px;left:0;right:0;}

.hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);color:#BFC6D0;text-align:center;
      font-size:14px;line-height:2;pointer-events:none;font-weight:600;}
.hint b{display:block;font-size:12px;font-weight:400;color:#CBD1DA;}

.ctx{position:fixed;background:#fff;border-radius:12px;box-shadow:0 3px 18px rgba(16,24,40,.2);
     padding:7px;display:none;gap:5px;align-items:center;z-index:25;border:1px solid var(--line);}
.ctx.on{display:flex;}
.ctx input{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-family:inherit;
           font-size:12.5px;outline:none;width:134px;}
.ctx input:focus{border-color:var(--or);}
.ctx input.wide{width:200px;}
.ctx .lb{font-size:11px;color:var(--mut);font-weight:700;padding:0 4px;}
.cb{width:32px;height:32px;border:none;background:#fff;border-radius:8px;cursor:pointer;color:#5A6472;
    font-size:14px;display:grid;place-items:center;font-family:inherit;}
.cb:hover{background:#F2F4F7;color:var(--ink);}
.cb.on{background:var(--or);color:#fff;}
.cb.red:hover{background:#FFF0EC;color:#E5484D;}
.cdiv{width:1px;height:22px;background:var(--line);margin:0 3px;}

.tools{position:absolute;bottom:22px;left:calc(50% + 153px);transform:translateX(-50%);background:var(--nv);
       border-radius:14px;padding:6px;display:flex;gap:3px;box-shadow:0 8px 28px rgba(15,59,124,.36);z-index:22;}
.tools button{min-width:38px;height:38px;border:none;background:transparent;color:#B9CBE6;border-radius:10px;
              cursor:pointer;font-size:15px;display:grid;place-items:center;font-family:inherit;padding:0 8px;}
.tools button:hover:not(:disabled){background:rgba(255,255,255,.14);color:#fff;}
.tools button:disabled{opacity:.32;cursor:default;}
.tools .zz{font-size:12px;font-weight:700;color:#DCE6F3;}
.tools .dv{width:1px;background:rgba(255,255,255,.18);margin:6px 4px;}

.mask{position:fixed;inset:0;background:rgba(10,18,32,.5);backdrop-filter:blur(3px);display:none;z-index:60;
      align-items:center;justify-content:center;padding:26px;}
.mask.on{display:flex;}
.modal{background:#fff;border-radius:18px;width:min(1140px,96vw);height:min(780px,92vh);
       display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(10,18,32,.36);}
.mhd{height:58px;flex:0 0 auto;border-bottom:1px solid var(--line2);display:flex;align-items:center;padding:0 18px;gap:10px;}
.mtabs{display:flex;gap:3px;margin-left:14px;background:#F2F4F7;padding:3px;border-radius:10px;}
.mtab{padding:7px 14px;font-size:12px;border-radius:8px;cursor:pointer;color:var(--sub);font-weight:600;}
.mtab.on{background:#fff;color:var(--nv);box-shadow:0 1px 3px rgba(16,24,40,.1);}
.mhd .r{margin-left:auto;display:flex;gap:7px;}
.mbody{flex:1;min-height:0;overflow:auto;padding:18px;background:#F5F7F9;}
.mbody iframe{width:100%;height:100%;min-height:530px;border:1px solid var(--line);border-radius:10px;background:#fff;}
.mbody pre{background:#0E1520;color:#D6DEEA;border-radius:12px;padding:17px 19px;overflow:auto;
           font-family:"D2Coding",Consolas,monospace;font-size:12px;line-height:1.75;}
.load{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.spin{width:34px;height:34px;border:3px solid #E4E8EE;border-top-color:var(--or);border-radius:50%;animation:sp .75s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.stp{font-size:13px;color:var(--sub);line-height:2.2;text-align:left;}
.stp div{opacity:.3;}
.stp div.done{opacity:1;color:var(--nv);}.stp div.done::before{content:"✓ ";color:var(--or);font-weight:700;}
.stp div.now{opacity:1;color:var(--ink);font-weight:700;}
.hidden{display:none;}
</style>
</head>
<body>

<div class="top">
  <div class="mark"><i></i></div><b class="bn">화면 스케치 스튜디오</b>
  <div class="sep"></div>
  <input class="fname" id="scrNm" value="지정대리인 등록">
  <div class="r">
    <button class="btn sm" onclick="loadSample()">샘플</button>
    <button class="btn sm" onclick="save()">임시저장</button>
    <div class="sep"></div>
    <button class="btn pri" onclick="build()">화면 생성</button>
  </div>
</div>

<div class="stage">
  <div class="pane">
    <div class="pbd">
      <h4>어느 시스템인가요?</h4>
      <div class="seg" id="sysSeg">
        <div class="on" data-sys="portal">하이포탈</div>
        <div data-sys="hicall">하이콜</div>
      </div>

      <h4>어떤 화면인가요?</h4>
      <div class="tpls" id="tpls">
        <div class="tpl on" data-tpl="list"><div class="wf"><i class="q"></i><i class="h"></i>
          <div class="g"><i></i><i></i><i></i></div><div class="g"><i></i><i></i><i></i></div></div>
          <div class="nm">목록 조회</div></div>
        <div class="tpl" data-tpl="detail"><div class="wf"><i class="h"></i><i class="m"></i><i></i><i class="q"></i></div>
          <div class="nm">상세 조회</div></div>
        <div class="tpl" data-tpl="form"><div class="wf"><i class="h"></i><i class="m"></i><i class="m"></i><i class="q"></i></div>
          <div class="nm">등록 · 수정</div></div>
        <div class="tpl" data-tpl="popup"><div class="wf" style="padding:8px 10px"><i class="h"></i><i></i><i class="m"></i></div>
          <div class="nm">팝업</div></div>
      </div>

      <h4>요소 추가 <span style="font-weight:400;color:var(--mut);font-size:11px">클릭하면 놓입니다</span></h4>
      <div class="grid2" id="clist"></div>
    </div>

    <div class="note">
      <textarea id="prompt" placeholder="화면으로 그리기 어려운 규칙을 적어주세요.
예) 종료일은 등록일 + 1년으로 자동 계산"></textarea>
      <div class="drop" onclick="addFile()">＋ 참고 파일 (Excel · PPT · 이미지)</div>
      <div class="files" id="files"></div>
    </div>
  </div>

  <div class="canvas" id="cv">
    <div class="abL" id="abL">지정대리인 등록 <span>960 × 600</span></div>
    <div id="board">
      <div class="hint" id="hint">화면을 자유롭게 그려보세요
        <b>반듯하지 않아도 괜찮습니다 · AI가 사내 표준으로 정리합니다</b></div>
    </div>
  </div>

  <div class="tools">
    <button id="bU" onclick="undo()" title="되돌리기 (Ctrl+Z)">↶</button>
    <button id="bR" onclick="redo()" title="다시 실행 (Ctrl+Y)">↷</button>
    <div class="dv"></div>
    <button onclick="zoom(-10)" title="축소">−</button>
    <button class="zz" id="zv" onclick="zoom(0,100)">100%</button>
    <button onclick="zoom(10)" title="확대">＋</button>
    <div class="dv"></div>
    <button onclick="clearAll()" title="전체 비우기">✕</button>
  </div>
</div>

<div class="ctx" id="ctx">
  <span class="lb" id="ctxT">버튼</span>
  <input id="fL" placeholder="문구" oninput="apply()">
  <input id="fC" class="wide hidden" placeholder="항목을 쉼표로 구분" oninput="apply()">
  <div class="cdiv"></div>
  <button class="cb" id="bReq" onclick="tog()" title="필수 입력 표시">＊</button>
  <div class="cdiv"></div>
  <button class="cb" onclick="dup()" title="복제 (Ctrl+D)">⧉</button>
  <button class="cb" onclick="front()" title="맨 앞으로">⬆</button>
  <button class="cb" onclick="back()" title="맨 뒤로">⬇</button>
  <button class="cb red" onclick="delSel()" title="삭제 (Del)">🗑</button>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mhd">
      <b style="font-size:14px" id="mTitle">생성 결과</b>
      <div class="mtabs" id="mtabs">
        <div class="mtab on" data-p="v">화면</div>
        <div class="mtab" data-p="j">전달 데이터</div>
        <div class="mtab" data-p="x">WebSquare XML</div>
      </div>
      <div class="r"><button class="btn sm" onclick="closeM()">닫기</button>
        <button class="btn sm nv">↓ 내려받기</button></div>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<script>
const COMPS=[
 {t:'title',n:'제목',g:'<div class="g n">▮</div>'},
 {t:'label',n:'글자',g:'<div class="g n" style="color:#3C4655;font-size:13px">가</div>'},
 {t:'input',n:'입력칸',g:'<div class="g u"></div>'},
 {t:'select',n:'선택',g:'<div class="g">▾</div>'},
 {t:'date',n:'날짜',g:'<div class="g">▤</div>'},
 {t:'check',n:'체크',g:'<div class="g" style="border:none;font-size:17px">☐</div>'},
 {t:'text',n:'긴 글',g:'<div class="g" style="height:30px"></div>'},
 {t:'list',n:'표',g:'<div class="g l"><span></span><span></span><span></span></div>'},
 {t:'button',n:'버튼',g:'<div class="g f"></div>'},
 {t:'area',n:'묶음',g:'<div class="g d"></div>'}
];
const DEF={area:[420,90],title:[180,26],label:[90,24],input:[160,28],select:[140,28],date:[130,28],
           check:[120,24],text:[340,70],list:[620,180],button:[90,30]};
const NAME={};COMPS.forEach(c=>NAME[c.t]=c.n);
const HASITEM={list:1,select:1};
const BW=960,BH=600,SNAP=6;
let shapes=[],sel=null,hist=[],future=[],uid=1,zm=100,files=[],clip=null,move=null,rs=null;
const board=document.getElementById('board'),ctx=document.getElementById('ctx');

document.getElementById('clist').innerHTML=COMPS.map(c=>
  `<div class="ci" onclick="add('${c.t}')">${c.g}<div class="t">${c.n}</div></div>`).join('');
const defLabel=t=>({title:'제목을 입력하세요',label:'항목명',button:'버튼',area:'묶음 영역',
  input:'',select:'',date:'',check:'선택 항목',text:'',list:'표'})[t]??NAME[t];
const defCols=t=>t==='list'?'순번,항목1,항목2,항목3':t==='select'?'선택1,선택2':'';
function add(t){
  push();const [w,h]=DEF[t];
  const y=shapes.length?Math.min(BH-h-20,Math.max(...shapes.map(s=>s.y+s.h))+20):40;
  shapes.push({id:uid++,t,x:Math.round((BW-w)/2),y,w,h,label:defLabel(t),cols:defCols(t),req:false});
  render();select(shapes.at(-1).id);
}
const pt=e=>{const r=board.getBoundingClientRect(),k=zm/100;
             return{x:(e.clientX-r.left)/k,y:(e.clientY-r.top)/k};};
const find=id=>shapes.find(s=>s.id===id);

function render(){
  board.querySelectorAll('.sh').forEach(e=>e.remove());
  shapes.forEach(s=>{
    const d=document.createElement('div');

    d.textContent=(s.req?'＊':'')+(s.label||NAME[s.t]);
    d.onmousedown=ev=>{
      ev.stopPropagation();
      if(ev.target.classList.contains('hh')){
        push();const p=pt(ev);
        rs={id:s.id,d:ev.target.dataset.d,ox:s.x,oy:s.y,ow:s.w,oh:s.h,px:p.x,py:p.y};return;}
      select(s.id);push();const p=pt(ev);move={id:s.id,dx:p.x-s.x,dy:p.y-s.y};
    };
    if(sel===s.id)['nw','n','ne','e','se','s','sw','w'].forEach(dir=>{
      const h=document.createElement('div');h.className='hh';h.dataset.d=dir;d.appendChild(h);});
    board.appendChild(d);
  });
  document.getElementById('hint').style.display=shapes.length?'none':'block';
  bU.disabled=!hist.length;bR.disabled=!future.length;
  placeCtx();
}
function quick(s){
  const el=board.querySelector('.sh[data-id="'+s.id+'"]');
  if(el)Object.assign(el.style,{left:s.x+'px',top:s.y+'px',width:s.w+'px',height:s.h+'px'});
}
function guides(s){
  board.querySelectorAll('.gd').forEach(e=>e.remove());
  const others=shapes.filter(o=>o.id!==s.id);
  const vT=[BW/2],hT=[BH/2];
  others.forEach(o=>{vT.push(o.x,o.x+o.w/2,o.x+o.w);hT.push(o.y,o.y+o.h/2,o.y+o.h);});
  let bx=null,by=null;
  [[s.x,0],[s.x+s.w/2,s.w/2],[s.x+s.w,s.w]].forEach(([v,off])=>
    vT.forEach(t=>{if(bx===null&&Math.abs(v-t)<=SNAP)bx={t,off};}));
  [[s.y,0],[s.y+s.h/2,s.h/2],[s.y+s.h,s.h]].forEach(([v,off])=>
    hT.forEach(t=>{if(by===null&&Math.abs(v-t)<=SNAP)by={t,off};}));
  if(bx){s.x=Math.round(bx.t-bx.off);line('v',bx.t);}
  if(by){s.y=Math.round(by.t-by.off);line('h',by.t);}
}
function line(dir,p){const g=document.createElement('div');g.className='gd '+dir;

  if(rs){const s=find(rs.id),p=pt(e),dx=p.x-rs.px,dy=p.y-rs.py,d=rs.d;
    if(d.includes('e'))s.w=Math.max(24,Math.round(rs.ow+dx));
    if(d.includes('s'))s.h=Math.max(20,Math.round(rs.oh+dy));
    if(d.includes('w')){const w=Math.max(24,Math.round(rs.ow-dx));s.x=rs.ox+rs.ow-w;s.w=w;}
    if(d.includes('n')){const h=Math.max(20,Math.round(rs.oh-dy));s.y=rs.oy+rs.oh-h;s.h=h;}
    guides(s);quick(s);placeCtx();}
});

function placeCtx(){

  let l=b.left+(s.x+s.w/2)*k-cw/2, t=b.top+s.y*k-54;
  if(t<68)t=b.top+(s.y+s.h)*k+12;

function tog(){const s=find(sel);if(!s)return;push();s.req=!s.req;

function dup(){const s=find(sel);if(!s)return;push();
  const c={...s,id:uid++,x:Math.min(BW-s.w,s.x+16),y:Math.min(BH-s.h,s.y+16)};

function front(){const s=find(sel);if(!s)return;push();
  shapes=shapes.filter(x=>x.id!==s.id).concat(s);render();}
function back(){const s=find(sel);if(!s)return;push();
  shapes=[s].concat(shapes.filter(x=>x.id!==s.id));render();}
function delSel(){if(sel===null)return;push();shapes=shapes.filter(s=>s.id!==sel);select(null);}

function push(){hist.push(JSON.stringify(shapes));future=[];if(hist.length>60)hist.shift();}
function undo(){if(!hist.length)return;future.push(JSON.stringify(shapes));
  shapes=JSON.parse(hist.pop());select(null);}
function redo(){if(!future.length)return;hist.push(JSON.stringify(shapes));
  shapes=JSON.parse(future.pop());select(null);}
function clearAll(){if(!shapes.length)return;push();shapes=[];select(null);}

document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const c=e.ctrlKey||e.metaKey;
  if(c&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(c&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}
  else if(c&&e.key.toLowerCase()==='c'){const s=find(sel);if(s)clip={...s};}
  else if(c&&e.key.toLowerCase()==='v'){if(!clip)return;push();
    const n={...clip,id:uid++,x:Math.min(BW-clip.w,clip.x+20),y:Math.min(BH-clip.h,clip.y+20)};
    shapes.push(n);render();select(n.id);}
  else if(c&&e.key.toLowerCase()==='d'){e.preventDefault();dup();}
  else if(e.key==='Delete'||e.key==='Backspace'){if(sel!==null){e.preventDefault();delSel();}}
  else if(e.key==='Escape')select(null);
  else if(e.key.indexOf('Arrow')===0&&sel!==null){e.preventDefault();
    const s=find(sel),d=e.shiftKey?10:1;
    if(e.key==='ArrowLeft')s.x=Math.max(0,s.x-d);
    if(e.key==='ArrowRight')s.x=Math.min(BW-s.w,s.x+d);
    if(e.key==='ArrowUp')s.y=Math.max(0,s.y-d);
    if(e.key==='ArrowDown')s.y=Math.min(BH-s.h,s.y+d);
    quick(s);placeCtx();}
});

function compile(){
  const areas=shapes.filter(s=>s.t==='area').sort((a,b)=>a.y-b.y),rest=shapes.filter(s=>s.t!=='area');
  const inside=(s,a)=>s.x>=a.x-8&&s.y>=a.y-8&&s.x+s.w<=a.x+a.w+8&&s.y+s.h<=a.y+a.h+8;
  const used=new Set(),blocks=[];
  areas.forEach(a=>{const ch=rest.filter(s=>inside(s,a));ch.forEach(s=>used.add(s.id));
    blocks.push({y:a.y,kind:'area',rows:group(ch)});});
  rest.filter(s=>!used.has(s.id)).forEach(s=>blocks.push({y:s.y,kind:'solo',s}));
  blocks.sort((a,b)=>a.y-b.y);
  let html='',xml='',btns=[];
  blocks.forEach(b=>{
    if(b.kind==='area'){html+='<div class="panel">';
      b.rows.forEach(r=>html+='<div class="row">'+r.map(el).join('')+'</div>');
      html+='</div>';b.rows.flat().forEach(s=>xml+=x1(s));
    }else{const s=b.s;
      if(s.t==='title')html+='<div class="sec"><h2>'+s.label+'</h2></div>';
      else if(s.t==='list'){const cs=(s.cols||'항목1,항목2,항목3').split(',').map(v=>v.trim());
        html+='<table><thead><tr>'+cs.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'
          +[1,2,3].map(n=>'<tr><td>'+n+'</td>'+cs.slice(1).map(()=>'<td></td>').join('')+'</tr>').join('')+'</tbody></table>';
        xml+='<w2:gridView id="grd'+s.id+'" dataList="dl'+s.id+'">\n'
          +cs.map(c=>'  <w2:gridColumn value="'+c+'"/>').join('\n')+'\n</w2:gridView>\n';}
      else if(s.t==='button'){btns.push(el(s));xml+=x1(s);}
      else{html+='<div class="row">'+el(s)+'</div>';xml+=x1(s);}}
  });
  if(btns.length)html+='<div class="ft">'+btns.join('')+'</div>';
  const css='*{margin:0;padding:0;box-sizing:border-box}\n'
+'body{font-family:"맑은 고딕",sans-serif;font-size:12px;background:#f5f4f1;padding:12px 14px}\n'
+'.panel{border:1px solid #c6c4bf;background:#fbfaf8;margin-bottom:4px}\n'
+'.row{display:flex;align-items:center;gap:8px;padding:7px 9px;flex-wrap:wrap}\n'
+'.row+.row{border-top:1px dotted #cecbc6}\n'
+'.lbl{white-space:nowrap}.lbl.req{color:#c00;font-weight:700}\n'
+'input,select{height:22px;padding:0 5px;border:1px solid #9b9995;font-size:12px;font-family:inherit;background:#fff}\n'
+'input.key{background:#f7efbe}\n'
+'textarea{width:100%;height:52px;border:1px solid #9b9995;padding:4px 6px;font-family:inherit;font-size:12px}\n'
+'.btn{display:inline-flex;align-items:center;justify-content:center;height:23px;padding:0 12px;line-height:1;'
+'white-space:nowrap;font-size:12px;font-weight:700;border:1px solid #9c9a95;background:linear-gradient(#fdfdfd,#e2e0dc);color:#3a3a3a}\n'
+'.btn.or{background:#F5821F;border-color:#D9700F;color:#fff}\n'
+'.btn.nv{background:#0F3B7C;border-color:#0A2A5C;color:#fff}\n'
+'.sec{margin:11px 0 4px}.sec h2{font-size:12px;font-weight:700;color:#0F3B7C}\n'
+'.sec h2:before{content:"";display:inline-block;width:3px;height:11px;background:#F5821F;margin-right:6px;vertical-align:-1px}\n'
+'table{width:100%;border-collapse:collapse;background:#fff;table-layout:fixed}\n'
+'th{height:25px;font-size:11px;font-weight:400;background:linear-gradient(#fdfdfc,#d9d7d2);border:1px solid #b3b1ac}\n'
+'td{height:23px;font-size:11px;text-align:center;border:1px solid #dbd9d4}\n'
+'.ft{display:flex;justify-content:flex-end;gap:4px;padding:10px 0}';
  return{html:'<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+html+'</body></html>',
         xml:xml||'<!-- 변환 대상 없음 -->'};
}
function group(list){const s=[...list].sort((a,b)=>a.y-b.y||a.x-b.x),rows=[];
  s.forEach(e=>{const r=rows.find(r=>Math.abs(r[0].y-e.y)<=20);r?r.push(e):rows.push([e]);});
  rows.forEach(r=>r.sort((a,b)=>a.x-b.x));return rows;}
function el(s){const L=s.label||'';
  switch(s.t){
    case 'label':return '<span class="lbl'+(s.req?' req':'')+'">'+L+'</span>';
    case 'input':return '<input type="text" class="key" style="width:'+s.w+'px"'+(L?' placeholder="'+L+'"':'')+'>';
    case 'date':return '<input type="text" class="key" style="width:'+s.w+'px" placeholder="YYYY-MM-DD">';
    case 'check':return '<label class="lbl"><input type="checkbox" style="height:auto"> '+L+'</label>';
    case 'select':return '<select style="width:'+s.w+'px">'+(s.cols||L||'선택').split(',').map(o=>'<option>'+o.trim()+'</option>').join('')+'</select>';
    case 'text':return '<textarea>'+L+'</textarea>';
    case 'button':return '<button class="btn'+(/저장|요청|확정|선택/.test(L)?' nv':/조회|검색/.test(L)?' or':'')+'">'+L+'</button>';
    default:return '<span class="lbl">'+L+'</span>';}}
function x1(s){switch(s.t){
    case 'input':return '<w2:inputBox id="ipb'+s.id+'"'+(s.req?' class="w2input_essential"':'')+'/>\n';
    case 'date':return '<w2:calendar id="cal'+s.id+'" displayFormat="yyyy-MM-dd"/>\n';
    case 'check':return '<w2:checkbox id="chk'+s.id+'" label="'+s.label+'"/>\n';
    case 'select':return '<w2:selectBox id="sel'+s.id+'" dataList="dl'+s.id+'"/>\n';
    case 'text':return '<w2:textarea id="txa'+s.id+'"/>\n';
    case 'button':return '<w2:trigger id="btn'+s.id+'" value="'+s.label+'" onclick="fn_'+s.id+'"/>\n';
    case 'label':return '<w2:textbox id="lbl'+s.id+'" value="'+s.label+'"/>\n';
    default:return '';}}
loadSample();
</script>
