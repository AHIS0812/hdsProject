<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>하이스케치 (HiSketch) 아이콘 — H 의 왼쪽 세로획이 연필</title>
  <!-- 배경: 브랜드 주황, 살짝 라운드 -->
  <rect x="0" y="0" width="256" height="256" rx="15.36" ry="15.36" fill="#F5821F"/>

  <!-- 오른쪽 세로획 + 가로대 (흰) -->
  <rect x="160" y="32" width="52.48" height="192" fill="#ffffff"/>
  <rect x="43.52" y="112.64" width="168.96" height="30.72" fill="#ffffff"/>

  <!-- 왼쪽 세로획 = 연필 -->
  <g>
    <!-- 몸통 -->
    <rect x="43.52" y="69.12" width="52.48" height="122.88" fill="#ffffff"/>
    <!-- 오른쪽 면 음영 -->
    <rect x="80.256" y="69.12" width="15.744" height="122.88" fill="#C87828" fill-opacity="0.12"/>
    <!-- 깎인 나무 원뿔 -->
    <polygon points="43.52,69.12 69.76,34.23 96,69.12" fill="#F0B27A"/>
    <polygon points="69.76,34.23 96,69.12 69.76,69.12" fill="#D98E4E"/>
    <!-- 흑연 심 -->
    <polygon points="60.31,69.12 69.76,32 79.21,69.12" fill="#33383F"/>
    <!-- 페룰(금속 밴드) -->
    <rect x="43.52" y="192" width="52.48" height="8.192" fill="#CAD2DC"/>
    <rect x="43.52" y="202.03" width="52.48" height="4.608" fill="#CAD2DC"/>
    <!-- 지우개 -->
    <rect x="43.52" y="204.8" width="52.48" height="19.2" fill="#F7B5A0"/>
  </g>
</svg>
