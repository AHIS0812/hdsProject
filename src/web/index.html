<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화면 스케치 스튜디오</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="top">
  <div class="mark"><i></i></div><b class="bn">화면 스케치 스튜디오</b>
  <div class="sep"></div>
  <input class="fname" id="scrNm" value="새 화면">
  <div class="r">
    <button class="btn sm" id="btnSample">샘플</button>
    <button class="btn sm" id="btnSave">임시저장</button>
    <div class="sep"></div>
    <button class="btn pri" id="btnBuild">화면 생성</button>
  </div>
</div>

<div class="stage">
  <div class="pane">
    <div class="pbd">
      <h4>어느 시스템인가요?</h4>
      <div class="cbox" id="sysBox">
        <button type="button" class="cbin empty">시스템 선택</button>
        <div class="cbpop">
          <input class="cbsearch" placeholder="시스템 검색">
          <div class="cblist"></div>
        </div>
      </div>

      <h4>어떤 작업인가요?</h4>
      <div class="seg" id="modeSeg">
        <div class="on" data-mode="new">신규 화면</div>
        <div data-mode="edit">변경 화면</div>
      </div>

      <div id="newBlock">
        <h4>어떤 화면인가요?</h4>
        <div class="tpls" id="tpls">
          <div class="tpl on" data-tpl="list"><div class="wf"><i class="q"></i><i class="h"></i>
            <div class="g"><i></i><i></i><i></i></div><div class="g"><i></i><i></i><i></i></div></div>
            <div class="nm">목록 조회</div></div>
          <div class="tpl" data-tpl="detail"><div class="wf"><i class="h"></i><i class="m"></i><i></i><i class="q"></i></div>
            <div class="nm">상세 조회</div></div>
          <div class="tpl" data-tpl="form"><div class="wf"><i class="h"></i><i class="m"></i><i class="m"></i><i class="q"></i></div>
            <div class="nm">등록 · 수정</div></div>
          <div class="tpl" data-tpl="popup"><div class="wf" style="padding:8px 10px"><i class="h"></i><i></i><i class="m"></i></div>
            <div class="nm">팝업</div></div>
        </div>
      </div>

      <div id="editBlock" class="hidden">
        <h4>어떤 화면을 변경하나요?</h4>
        <div class="cbox" id="scrBox">
          <button type="button" class="cbin empty">먼저 시스템을 선택하세요</button>
          <div class="cbpop">
            <input class="cbsearch" placeholder="화면명 검색">
            <div class="cblist"></div>
          </div>
        </div>
      </div>

      <h4>요소 추가 <span style="font-weight:400;color:var(--mut);font-size:11px">클릭하면 놓입니다</span></h4>
      <div class="grid2" id="clist"></div>
    </div>

    <div class="note">
      <textarea id="prompt" placeholder="화면으로 그리기 어려운 규칙을 적어주세요.
예) 종료일은 등록일 + 1년으로 자동 계산"></textarea>
      <div class="drop" id="drop">＋ 참고 파일 (Excel · PPT · 이미지)</div>
      <div class="files" id="files"></div>
    </div>
  </div>

  <div class="canvas" id="cv">
    <div class="abL" id="abL">새 화면 <span>960 × 600</span></div>
    <div id="board">
      <div class="hint" id="hint">화면을 자유롭게 그려보세요
        <b>반듯하지 않아도 괜찮습니다 · AI가 사내 표준으로 정리합니다</b></div>
    </div>
  </div>

  <div class="tools">
    <button id="bU" data-act="undo" title="되돌리기 (Ctrl+Z)">↶</button>
    <button id="bR" data-act="redo" title="다시 실행 (Ctrl+Y)">↷</button>
    <div class="dv"></div>
    <button data-act="zoomOut" title="축소">−</button>
    <button class="zz" id="zv" data-act="zoomReset">100%</button>
    <button data-act="zoomIn" title="확대">＋</button>
    <div class="dv"></div>
    <button data-act="clear" title="전체 비우기">✕</button>
  </div>
</div>

<div class="ctx" id="ctx">
  <span class="lb" id="ctxT">버튼</span>
  <input id="fL" placeholder="문구">
  <input id="fC" class="wide hidden" placeholder="항목을 쉼표로 구분">
  <div class="cdiv"></div>
  <button class="cb" id="bReq" data-act="req" title="필수 입력 표시">＊</button>
  <div class="cdiv"></div>
  <button class="cb" data-act="dup" title="복제 (Ctrl+D)">⧉</button>
  <button class="cb" data-act="front" title="맨 앞으로">⬆</button>
  <button class="cb" data-act="back" title="맨 뒤로">⬇</button>
  <button class="cb red" data-act="del" title="삭제 (Del)">🗑</button>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mhd">
      <b style="font-size:14px" id="mTitle">생성 결과</b>
      <div class="mtabs" id="mtabs">
        <div class="mtab on" data-p="v">화면</div>
        <div class="mtab" data-p="j">전달 데이터</div>
        <div class="mtab" data-p="x">WebSquare XML</div>
      </div>
      <div class="r">
        <button class="btn sm" id="mClose">닫기</button>
        <button class="btn sm nv" id="mDownload">↓ 내려받기</button>
      </div>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
