<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 프로젝트 — 하이스케치</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="home.css">
</head>
<body>

<div class="app">

  <!-- 좌측: 새로 만들기 · 보기 전환 · 시스템 필터 · 저장 공간 -->
  <aside class="side" id="side" aria-label="프로젝트 메뉴">
    <a class="brand" href="/" aria-label="하이스케치 홈">
      <img class="mark" src="/icon.png" alt="" aria-hidden="true" width="36" height="36"><b>하이스케치</b>
    </a>
    <button class="btn pri wide" id="btnNew" type="button"><span class="ico" data-i="plus"></span>새 프로젝트</button>

    <nav class="nav" id="nav" aria-label="보기">
      <button class="nav-item on" type="button" data-view="all" aria-current="page"><span class="ico" data-i="home"></span><span class="lb">모든 프로젝트</span><em id="cAll">0</em></button>
      <button class="nav-item" type="button" data-view="fav"><span class="ico" data-i="star"></span><span class="lb">즐겨찾기</span><em id="cFav">0</em></button>
      <button class="nav-item" type="button" data-view="trash"><span class="ico" data-i="trash"></span><span class="lb">휴지통</span><em id="cTrash">0</em></button>
    </nav>

    <div class="side-title" id="sysTitle" hidden>시스템별 보기</div>
    <div class="sysnav" id="sysNav" role="group" aria-labelledby="sysTitle"></div>

    <div class="side-foot">
      <div class="usage" id="usage" title="이 브라우저에 저장된 프로젝트 용량(추정). 가득 차면 저장이 안 될 수 있어요.">
        <div class="usage-row"><span>저장 공간</span><span id="usageTxt">–</span></div>
        <div class="usage-bar" aria-hidden="true"><i id="usageBar"></i></div>
      </div>
      <button class="btn sm wide" id="btnImport" type="button"><span class="ico" data-i="upload"></span>파일 가져오기</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="bar">
      <button class="icon-btn menu-btn" id="btnMenu" type="button" aria-label="메뉴 열기" aria-controls="side" aria-expanded="false"><span class="ico" data-i="menu"></span></button>
      <label class="search">
        <span class="ico" data-i="search"></span>
        <input id="q" type="search" placeholder="프로젝트·화면·시스템 검색" autocomplete="off" aria-label="프로젝트 검색">
        <kbd id="qHint">/</kbd>
      </label>
      <div class="bar-r">
        <button class="btn pri" id="btnNew2" type="button" aria-label="새 프로젝트"><span class="ico" data-i="plus"></span><span class="t">새 프로젝트</span></button>
      </div>
    </header>

    <main class="content" id="content">

      <!-- 빠른 시작: 화면 유형을 누르면 바로 만들어서 에디터로 -->
      <section class="hero" id="hero" aria-labelledby="heroTitle">
        <div class="hero-top">
          <div class="hero-txt">
            <span class="hero-kicker">HISKETCH</span>
            <h1 id="heroTitle">어떤 화면을 스케치할까요?</h1>
            <p>화면 유형을 고르면 바로 새 프로젝트가 만들어지고 에디터가 열려요. 작업 내용은 자동으로 저장됩니다.</p>
          </div>
          <div class="hero-art" aria-hidden="true"><i class="bs b1"></i><i class="bs b2"></i><img src="/icon.png" alt="" width="156" height="156"></div>
        </div>
        <div class="tiles" id="tiles" role="list"></div>
      </section>

      <section class="listing" aria-labelledby="listTitle">
        <div class="list-head">
          <h2 id="listTitle">모든 프로젝트</h2>
          <span class="count" id="listCount"></span>
          <div class="tools">
            <div class="chips" id="modeChips" role="group" aria-label="작업 구분">
              <button type="button" class="chip-btn on" data-mode="all" aria-pressed="true">전체</button>
              <button type="button" class="chip-btn" data-mode="new" aria-pressed="false">신규</button>
              <button type="button" class="chip-btn" data-mode="edit" aria-pressed="false">변경</button>
            </div>
            <label class="sel">
              <span class="sr">정렬</span>
              <select id="sort" aria-label="정렬"></select>
            </label>
            <div class="seg2" id="layoutSeg" role="group" aria-label="보기 방식">
              <button type="button" data-layout="grid" class="on" aria-pressed="true" title="카드로 보기" aria-label="카드로 보기"><span class="ico" data-i="grid"></span></button>
              <button type="button" data-layout="list" aria-pressed="false" title="목록으로 보기" aria-label="목록으로 보기"><span class="ico" data-i="list"></span></button>
            </div>
            <button class="btn sm danger-o" id="btnEmptyTrash" type="button" hidden>휴지통 비우기</button>
          </div>
        </div>
        <p class="trash-note" id="trashNote" hidden>휴지통의 프로젝트는 30일이 지나면 영구 삭제돼요. 그 전에는 언제든 복원할 수 있어요.</p>

        <div class="bulk" id="bulk" hidden role="toolbar" aria-label="선택한 프로젝트 작업"></div>

        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden></div>
      </section>

    </main>
  </div>
</div>

<div class="drop-mask" id="dropMask" hidden>
  <div class="drop-box"><span class="ico big" data-i="upload"></span><b>여기에 놓으면 프로젝트로 가져와요</b><span>.hds.json 파일 또는 내보내기로 만든 .zip</span></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="/vendor/fflate.js"></script>
<script type="module" src="js/home.js"></script>
</body>
</html>
